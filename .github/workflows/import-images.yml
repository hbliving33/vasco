name: Import images from vascosolar.com

on:
  workflow_dispatch:
  push:
    paths:
      - assets/manifest.txt

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download every file in the manifest
        run: |
          mkdir -p assets/img
          failed=0
          while read -r name url; do
            [ -z "$name" ] && continue
            case "$name" in \#*) continue;; esac
            if curl -fsSL --retry 3 -A "Mozilla/5.0" -o "assets/img/$name" "$url"; then
              echo "ok   $name"
            else
              echo "FAIL $name  $url"; rm -f "assets/img/$name"; failed=$((failed+1))
            fi
          done < assets/manifest.txt
          echo "Failed downloads: $failed"
      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add assets/img
          git diff --cached --quiet || git commit -m "Import images from vascosolar.com"
          git push
